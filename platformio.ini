; ==============================================================================
; PlatformIO Configuration - Projekt Ascon (NIST SP 800-232)
; Wspolne srodowisko dla ESP8266 oraz ESP32 z zachowaniem kodu rdzenia w src/
; ==============================================================================

[platformio]
default_envs = esp8266
src_dir = firmware_esp8266
include_dir = include
test_dir = tests

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Iinclude
    -std=c99
    -Wall
    -Wextra
build_src_filter =
    +<*.cpp>
    +<*.c>
    +<../src/*.c>
test_build_src = yes

; --- Srodowisko dla ESP8266 (NodeMCU v2 / WeMos D1 Mini / ESP-12E) ---
[env:esp8266]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 80000000L

; --- Opcjonalne srodowisko dla ESP32 (DevKit / WROOM) ---
[env:esp32]
platform = espressif32
board = esp32dev
board_build.f_cpu = 240000000L
